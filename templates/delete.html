{% extends "base.html" %}

{% block site_title %}
Delete Article
{% endblock site_title %}

{% block content %}
<div class="card shadow p-4 mt-4">
    <h2 class="text-danger">Delete Article</h2>
    <p>Are you sure you want to delete "<strong>{{ article.title }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            Yes, Delete
        </button>

        <a href="{% url 'articles:detail' article.slug %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock content %}
